<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Checklists</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>Daily Audit Review</h1>

      <select id="userSelect">
        <option value="">Select Your Name</option>
      </select>

      <button id="loginButton">Login</button>
    </div>
  </div>

  <div class="app-shell hidden" id="appShell">

    <header class="top-bar">
      <div>
        <h1>Restaurant Audit Review</h1>
        <p id="reviewDateText"></p>
      </div>

      <div class="date-controls">
        <button id="prevDayBtn">◀</button>
        <input type="date" id="datePicker">
        <button id="nextDayBtn">▶</button>
      </div>
    </header>

    <section class="legend-panel">
      <div class="legend-item blue">
        = Partial Information Reviewed
      </div>

      <div class="legend-item green">
        = Fully Reviewed and Verified
      </div>

      <div class="legend-item orange">
        = Missing Information or Missed Target
      </div>
    </section>

    <section class="table-wrapper" id="tableWrapper">
      <div id="auditTableContainer"></div>
    </section>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
